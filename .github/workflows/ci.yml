name: cross-platform-contract

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'docs/DEEPSEEK_HARNESS_INTEGRATION.zh-CN.md'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'docs/DEEPSEEK_HARNESS_INTEGRATION.zh-CN.md'

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install -r scripts/requirements-ci.in
      - run: python scripts/validate_schema.py
      - run: python scripts/generate_shared.py --check
      - run: python scripts/check_shared.py

  windows:
    needs: shared
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - shell: powershell
        run: |
          ./scripts/build-windows.ps1
          ./outputs/AgentHalo/AgentHalo.exe --self-test ./outputs/windows-self-test.txt
          Get-Content ./outputs/windows-self-test.txt

  macos:
    needs: shared
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Run macOS core checks
        working-directory: src/macos
        run: swift run AgentHaloCoreChecks
      - working-directory: src/macos
        run: swift build -c release --product AgentHaloMac
